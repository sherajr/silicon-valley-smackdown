<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silicon Valley Smackdown</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #100a30;
        overflow: hidden;
        height: 100%;
        width: 100%;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* Positioning context for the 3D canvas (src/render3d/GameRenderer3D.ts), which is
           absolutely positioned to sit pixel-for-pixel behind Phaser's own canvas. */
        position: relative;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #loading-fallback {
        color: #00e5ff;
        font-family: monospace;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="app"><div id="loading-fallback">Loading Silicon Valley Smackdown...</div></div>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
