# Fly.io deploy for the online room server. Rooms live in memory, so run exactly one machine
# (deploy with `fly deploy --ha=false`). A stopped machine wakes on the next visit.
app = "svs-arena"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  HOST = "0.0.0.0"
  TRUST_PROXY = "fly"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
