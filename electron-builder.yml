appId: com.sherajr.siliconvalleysmackdown
productName: Silicon Valley Smackdown
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: desktop/resources
files:
  - dist/**/*
  - desktop/*.cjs
  - package.json
  - '!node_modules/**/*'
win:
  target:
    - target: nsis
      arch: [x64]
  icon: desktop/resources/icon.ico
  artifactName: Silicon-Valley-Smackdown-${version}-Windows-${arch}-Setup.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.games
  icon: desktop/resources/icon.icns
  # No Apple Developer ID certificate is configured, so leave the app fully unsigned rather
  # than have electron-builder fail looking for one or produce an ad-hoc signature that still
  # trips Gatekeeper. See docs/macos.md for what this means for players.
  identity: null
  artifactName: Silicon-Valley-Smackdown-${version}-macOS-${arch}.${ext}
dmg:
  artifactName: Silicon-Valley-Smackdown-${version}-macOS-${arch}.${ext}
