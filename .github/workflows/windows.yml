name: Windows installer

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop:unit
      - name: Build Windows installer
        run: npm run dist:win
      - name: Install for the current user
        shell: pwsh
        run: |
          $installer = Get-Item 'release/*-Setup.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'Smackdown Install Test'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $exe = Join-Path $installDir 'Silicon Valley Smackdown.exe'
          if (!(Test-Path $exe)) { throw 'Installed game executable is missing' }
          "SVS_DESKTOP_EXE=$exe" >> $env:GITHUB_ENV
      - name: Test the installed game
        run: npm run test:desktop
      - name: Verify uninstall
        shell: pwsh
        run: |
          $uninstaller = Get-Item (Join-Path (Split-Path $env:SVS_DESKTOP_EXE) 'Uninstall*.exe')
          $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller exited with $($process.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $env:SVS_DESKTOP_EXE) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $env:SVS_DESKTOP_EXE) { throw 'Uninstall left the game executable behind' }
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem 'release/*-Setup.exe' | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content 'release/SHA256SUMS.txt' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Silicon-Valley-Smackdown-Windows-x64
          path: |
            release/*-Setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-results
          path: test-results/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Silicon-Valley-Smackdown-Windows-x64
          path: release
      - name: Create a draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --draft --verify-tag --title "Silicon Valley Smackdown $RELEASE_TAG" --generate-notes
